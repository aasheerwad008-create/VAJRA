name: VAJRA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  # ── Go Backend ──────────────────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v -count=1

  # ── Voice AI ────────────────────────────────────────────────────────────
  voice-ai:
    name: Voice AI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: voice-ai/requirements.txt
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m pytest tests/ -v

  # ── Adversarial Engine ──────────────────────────────────────────────────
  adversarial-engine:
    name: Adversarial Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adversarial-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: adversarial-engine/requirements.txt
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: python -m pytest tests/ -v

  # ── ZK Proof System (Rust) ─────────────────────────────────────────────
  zk-proof:
    name: ZK Proof System (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zk-proof-system
      - run: cargo test --manifest-path zk-proof-system/host/Cargo.toml -v
      - run: cargo test --manifest-path zk-proof-system/guest/Cargo.toml -v

  # ── rPPG WASM (Rust) ───────────────────────────────────────────────────
  rppg-wasm:
    name: rPPG WASM (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rppg-wasm
      - run: cd rppg-wasm && cargo test -v

  # ── Blockchain (Solidity) ──────────────────────────────────────────────
  blockchain:
    name: Blockchain (Solidity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
