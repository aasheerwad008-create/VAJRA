version: "3.9"

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vajra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vajra_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vajra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vajra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Voice AI Service ──────────────────────────────────────────────────────
  voice-ai:
    build:
      context: ./voice-ai
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vajra:vajra_secret@postgres:5432/vajra}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - voice_models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ── Adversarial Engine ────────────────────────────────────────────────────
  adversarial-engine:
    build:
      context: ./adversarial-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── ZK Proof System ───────────────────────────────────────────────────────
  zk-proof-system:
    build:
      context: ./zk-proof-system
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend (Go) ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://vajra:vajra_secret@postgres:5432/vajra}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_32_char_min}
      API_KEY: ${API_KEY:-vajra_api_key_change_me}
      VOICE_AI_URL: http://voice-ai:8001
      ADVERSARIAL_URL: http://adversarial-engine:8002
      ZK_PROOF_URL: http://zk-proof-system:8003
      POLYGON_RPC_URL: ${POLYGON_AMOY_RPC_URL:-https://rpc-amoy.polygon.technology}
      POLYGON_FALLBACK_RPC_URL: ${POLYGON_FALLBACK_RPC_URL:-https://polygon-amoy-bor-rpc.publicnode.com}
      TRUST_REGISTRY_ADDRESS: ${TRUST_REGISTRY_ADDRESS:-0x0000000000000000000000000000000000000000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      voice-ai:
        condition: service_healthy
      adversarial-engine:
        condition: service_healthy
      zk-proof-system:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      NEXT_PUBLIC_TRUST_REGISTRY_ADDRESS: ${NEXT_PUBLIC_TRUST_REGISTRY_ADDRESS:-0x0000000000000000000000000000000000000000}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-80002}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  voice_models:
