[package]
name = "vajra-zk-guest"
version = "1.0.0"
edition = "2021"
description = "VAJRA ZK Circuit — guest program executed inside the zkVM to prove biometric identity"

[[bin]]
name = "vajra-zk-guest"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
